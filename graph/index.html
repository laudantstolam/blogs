      const SPRING_LENGTH = 120;         // Ideal edge length (increased)
      const SPRING_STRENGTH = 0.015;     // Edge spring stiffness (softer)
      const CENTER_GRAVITY = 0.002;      // Pull toward center (much weaker)
      const DAMPING = 0.88;              // Velocity decay (0.85 = floaty, 0.7 = snappy)
      const MIN_VELOCITY = 0.1;          // Stop threshold
      const BOUNDARY_PADDING = 40;       // Distance from edges
      const BOUNDARY_STIFFNESS = 0.08;   // How hard boundaries push back

      // Get graph center and bounds
      function getGraphCenter() {
        const container = document.getElementById('cy');
        const rect = container.getBoundingClientRect();
        const pan = cy.pan();
        const zoom = cy.zoom();
        return {
          x: (rect.width / 2 - pan.x) / zoom,
          y: (rect.height / 2 - pan.y) / zoom
        };
      }

      function getBounds() {
        const container = document.getElementById('cy');
        const rect = container.getBoundingClientRect();
        const pan = cy.pan();
        const zoom = cy.zoom();
        return {
          minX: (BOUNDARY_PADDING - pan.x) / zoom,
          maxX: (rect.width - BOUNDARY_PADDING - pan.x) / zoom,
          minY: (BOUNDARY_PADDING - pan.y) / zoom,
          maxY: (rect.height - BOUNDARY_PADDING - pan.y) / zoom
        };
      }

      // Main physics simulation loop
      function simulate() {
        if (!isSimulationRunning) return;

        const visibleNodes = cy.nodes(':visible');
        const bounds = getBounds();
        const center = getGraphCenter();
        let totalEnergy = 0;

        // Calculate forces for each node
        visibleNodes.forEach(node => {
          // Skip dragged node
          if (draggedNode && node.id() === draggedNode.id()) return;

          let vel = velocities.get(node.id()) || { vx: 0, vy: 0 };
          const pos = node.position();
          let fx = 0, fy = 0;

          // 1. REPULSION: Push away from nearby nodes (prevents overlap)
          visibleNodes.forEach(other => {
            if (other.id() === node.id()) return;

            const otherPos = other.position();
            const dx = pos.x - otherPos.x;
            const dy = pos.y - otherPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;

            if (dist < REPULSION_DISTANCE) {
              // Inverse square law with softening
              const strength = REPULSION_STRENGTH / (dist * dist + 50);
              // Normalize and apply
              fx += (dx / dist) * strength;
              fy += (dy / dist) * strength;
            }
          });

          // 2. SPRINGS: Pull toward connected nodes
          const edges = node.connectedEdges(':visible');
          edges.forEach(edge => {
            const other = edge.source().id() === node.id() ? edge.target() : edge.source();

            // Skip if other is being dragged
            if (draggedNode && other.id() === draggedNode.id()) {
              // Extra strong spring to dragged node for "following" effect
              const otherPos = other.position();
              const dx = otherPos.x - pos.x;
              const dy = otherPos.y - pos.y;
              const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
              const displacement = dist - SPRING_LENGTH * 0.6;
              const force = displacement * SPRING_STRENGTH * 3; // 3x stronger
              fx += (dx / dist) * force;
              fy += (dy / dist) * force;
              return;
            }

            const otherPos = other.position();
            const dx = otherPos.x - pos.x;
            const dy = otherPos.y - pos.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;

            // Hooke's law: F = k * displacement
            const displacement = dist - SPRING_LENGTH;
            const force = displacement * SPRING_STRENGTH;
            fx += (dx / dist) * force;
            fy += (dy / dist) * force;
          });

          // 3. CENTER GRAVITY: Gentle pull toward center
          const toCenterX = center.x - pos.x;
          const toCenterY = center.y - pos.y;
          fx += toCenterX * CENTER_GRAVITY;
          fy += toCenterY * CENTER_GRAVITY;

          // 4. BOUNDARY: Soft push from edges
          if (pos.x < bounds.minX) {
            fx += (bounds.minX - pos.x) * BOUNDARY_STIFFNESS;
          } else if (pos.x > bounds.maxX) {
            fx += (bounds.maxX - pos.x) * BOUNDARY_STIFFNESS;
          }
          if (pos.y < bounds.minY) {
            fy += (bounds.minY - pos.y) * BOUNDARY_STIFFNESS;
          } else if (pos.y > bounds.maxY) {
            fy += (bounds.maxY - pos.y) * BOUNDARY_STIFFNESS;
          }

          // Apply forces to velocity
          vel.vx += fx;
          vel.vy += fy;

          // Apply damping (creates floaty deceleration)
          vel.vx *= DAMPING;
          vel.vy *= DAMPING;

          // Clamp velocity for stability
          const maxVel = 20;
          const speed = Math.sqrt(vel.vx * vel.vx + vel.vy * vel.vy);
          if (speed > maxVel) {
            vel.vx = (vel.vx / speed) * maxVel;
            vel.vy = (vel.vy / speed) * maxVel;
          }

          totalEnergy += speed;
          velocities.set(node.id(), vel);

          // Update position if moving enough
          if (speed > MIN_VELOCITY) {
            let newX = pos.x + vel.vx;
            let newY = pos.y + vel.vy;

            // Hard clamp to boundaries
            newX = Math.max(bounds.minX, Math.min(bounds.maxX, newX));
            newY = Math.max(bounds.minY, Math.min(bounds.maxY, newY));

            node.position({ x: newX, y: newY });
          }
        });

        // Constrain dragged node to boundaries
        if (draggedNode) {
          const dragPos = draggedNode.position();
          const clampedX = Math.max(bounds.minX, Math.min(bounds.maxX, dragPos.x));
          const clampedY = Math.max(bounds.minY, Math.min(bounds.maxY, dragPos.y));
          if (clampedX !== dragPos.x || clampedY !== dragPos.y) {
            draggedNode.position({ x: clampedX, y: clampedY });
          }
        }

        // Continue simulation
        animationFrame = requestAnimationFrame(simulate);
      }

      // Start continuous simulation
      simulate();

      // Drag handlers
      cy.on('grab', 'node', function(evt) {
        draggedNode = evt.target;
        draggedNode.addClass('dragging');
        lastDragPos = { ...draggedNode.position() };
      });

      cy.on('drag', 'node', function(evt) {
        // Track drag for momentum on release
        if (draggedNode) {
          const currentPos = draggedNode.position();
          if (lastDragPos) {
            // Store drag velocity for connected nodes to inherit
            const dragVel = {
              vx: (currentPos.x - lastDragPos.x) * 0.5,
              vy: (currentPos.y - lastDragPos.y) * 0.5
            };
            // Give connected nodes some of the drag momentum
            const connected = draggedNode.connectedEdges(':visible').connectedNodes().not(draggedNode);
            connected.forEach(cn => {
              const vel = velocities.get(cn.id()) || { vx: 0, vy: 0 };
              vel.vx += dragVel.vx * 0.2;
              vel.vy += dragVel.vy * 0.2;
              velocities.set(cn.id(), vel);
            });
          }
          lastDragPos = { ...currentPos };
        }
      });

      cy.on('free', 'node', function(evt) {
        const node = evt.target;
        node.removeClass('dragging');

        // Give the released node some momentum based on last drag
        if (lastDragPos) {
          const currentPos = node.position();
          const vel = {
            vx: (currentPos.x - lastDragPos.x) * 0.3,
            vy: (currentPos.y - lastDragPos.y) * 0.3
          };
          velocities.set(node.id(), vel);
        }

        draggedNode = null;
        lastDragPos = null;
      });

      // Click post node to open article
      cy.on('tap', 'node[type="post"]', function(evt){
        const url = evt.target.data('url');
        if (url) {
          window.open(url, '_blank');
        }
      });

      // Click tag node to highlight connected posts
      cy.on('tap', 'node[type="tag"]', function(evt){
        const node = evt.target;
        const connected = node.connectedEdges().connectedNodes();

        cy.elements().removeClass('highlighted faded hover hover-connected dimmed');
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        connected.removeClass('faded').addClass('highlighted');
        node.connectedEdges().removeClass('faded');
      });

      // Click background to reset
      cy.on('tap', function(evt){
        if (evt.target === cy) {
          cy.elements().removeClass('highlighted faded hover hover-connected dimmed');
        }
      });

      // Button controls
      document.getElementById('btn-all').addEventListener('click', function() {
        cy.nodes('[type="post"]').removeClass('hidden');
        cy.edges(':not([weight])').removeClass('hidden');
        document.getElementById('btn-all').classList.add('active');
        document.getElementById('btn-tags').classList.remove('active');
        runLayout();
      });

      document.getElementById('btn-tags').addEventListener('click', function() {
        cy.nodes('[type="post"]').addClass('hidden');
        cy.edges(':not([weight])').addClass('hidden');
        document.getElementById('btn-tags').classList.add('active');
        document.getElementById('btn-all').classList.remove('active');
      });

      document.getElementById('btn-reset').addEventListener('click', function() {
        cy.elements().removeClass('highlighted faded hover hover-connected dimmed');
        cy.fit(null, 50);
      });

      document.getElementById('btn-layout').addEventListener('click', function() {
        runLayout();
      });

      // Theme toggle
      const themeToggle = document.getElementById('theme-toggle');

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        updateGraphColors();
      }

      function toggleTheme() {
        const current = getTheme();
        setTheme(current === 'light' ? 'dark' : 'light');
      }

      // Initialize theme
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateGraphColors();
      }

      themeToggle.addEventListener('click', toggleTheme);

      // Listen for theme changes from other tabs/windows
      window.addEventListener('storage', function(e) {
        if (e.key === 'theme') {
          document.documentElement.setAttribute('data-theme', e.newValue);
          updateGraphColors();
        }
      });

      // Also listen for theme changes via MutationObserver (for iframe sync)
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.attributeName === 'data-theme') {
            updateGraphColors();
          }
        });
      });
      observer.observe(document.documentElement, { attributes: true });
    })();</script> </body> </html>
